version: '3'

# AMO signing keys: WEB_EXT_API_KEY / WEB_EXT_API_SECRET (git-ignored, see sign task)
dotenv: ['.env']

vars:
  # ponytail: no .nvmrc in repo, uses nvm's default Node; add .nvmrc to pin one
  NODE: 'bash -c ''export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" >/dev/null; nvm use default >/dev/null; exec "$@"'' --'

tasks:
  setup:
    desc: Install dev dependencies
    cmds:
      - '{{.NODE}} npm ci'
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]

  run:
    desc: Run extension in a throwaway Firefox profile with auto-reload
    deps: [build, setup]
    cmds:
      - '{{.NODE}} npx web-ext run -s src'

  run:profile:
    desc: Run extension in your real Firefox profile (shares real tab group data!)
    deps: [setup]
    cmds:
      - '{{.NODE}} npx web-ext run -s src --firefox-profile=default-release --keep-profile-changes'

  lint:
    desc: Run eslint and web-ext lint
    deps: [setup]
    cmds:
      - '{{.NODE}} npm run lint'

  build:
    desc: Package extension zip into web-ext-artifacts/
    deps: [setup]
    cmds:
      - '{{.NODE}} npx web-ext build -s src --overwrite-dest'

  sign:
    desc: Sign a private test build via AMO (unlisted); uses up the version number, so `task release` needs a higher one
    deps: [setup]
    preconditions:
      - sh: test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET"
        msg: 'Fill WEB_EXT_API_KEY and WEB_EXT_API_SECRET in .env (see .env.example)'
    cmds:
      # web-ext reads the keys from the environment, so they never hit the command line
      - '{{.NODE}} npx web-ext sign -s src --channel=unlisted'

  install:deved:
    desc: Install build into Firefox Developer Edition profile (restart Firefox to load)
    deps: [build]
    vars:
      PROFILE:
        sh: ls -d ~/.mozilla/firefox/*.dev-edition-default
      ID: marko.koivusalo@gmail.com
    cmds:
      - mkdir -p "{{.PROFILE}}/extensions"
      - cp "$(ls -t web-ext-artifacts/*.zip | head -1)" "{{.PROFILE}}/extensions/{{.ID}}.xpi"
      # ponytail: user.js is re-applied on every start; allows unsigned + profile-dir (sideloaded) add-ons
      - |
        grep -q xpinstall.signatures.required "{{.PROFILE}}/user.js" 2>/dev/null || cat >> "{{.PROFILE}}/user.js" <<'JS'
        user_pref("xpinstall.signatures.required", false);
        user_pref("extensions.autoDisableScopes", 14);
        JS
      - echo "Installed to {{.PROFILE}} - restart Firefox Developer Edition"

  release:
    desc: Publish the manifest version to AMO (listed) and GitHub; bump and commit the version first
    deps: [setup]
    vars:
      VERSION: &version
        sh: grep -m1 '"version"' src/manifest.json | cut -d'"' -f4
    preconditions:
      - sh: test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET"
        msg: 'Fill WEB_EXT_API_KEY and WEB_EXT_API_SECRET in .env (see .env.example)'
      - sh: gh auth status
        msg: 'Log in with: gh auth login'
      - sh: test "$(git branch --show-current)" = master && test -z "$(git status --porcelain)"
        msg: 'Release from master with a clean working tree'
      - sh: git fetch -q origin && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
        msg: 'Local master differs from origin/master; push or pull first'
      - sh: test -z "$(git ls-remote --tags origin {{.VERSION}})"
        msg: 'Tag {{.VERSION}} is already on GitHub; bump the version in src/manifest.json'
    cmds:
      - '{{.NODE}} npm test'
      # ponytail: no wait for AMO review, so the GitHub release has no xpi and links to AMO instead
      - '{{.NODE}} npx web-ext sign -s src --channel=listed --amo-metadata=amo-metadata.json --approval-timeout=0'
      - task: release:github

  release:github:
    desc: Tag the manifest version and create its GitHub release (rerun this alone if `task release` fails after the AMO step)
    vars:
      VERSION: *version
      # gh defaults to the upstream repo here, so always name the fork
      REPO: paranoidi/panorama-ng
    cmds:
      - git tag {{.VERSION}}
      - git push origin {{.VERSION}}
      # ponytail: notes are README's cumulative feature list; use a changelog when releases need their own notes
      - |
        { echo "Install from [Firefox Add-ons](https://addons.mozilla.org/firefox/addon/panorama-ng/)."; echo; awk '/^## Description/{exit} /^## New features/{f=1} f' README.md; } | gh release create {{.VERSION}} -R {{.REPO}} --verify-tag --title {{.VERSION}} --notes-file -
